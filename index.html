  --card-ink-variant:#6d6f7c;
  --card-ink-quiet:#85878f;
  --purple:#c27fe5;
  --coral:#e57f7f; --r-sm:8px; --r-lg:16px; --r-xl:28px;
  --e1:0 1px 2px rgba(0,0,0,.30),0 1px 3px 1px rgba(0,0,0,.15);
  --e2:0 1px 2px rgba(0,0,0,.30),0 2px 6px 2px rgba(0,0,0,.15);
  --e3:0 1px 3px rgba(0,0,0,.30),0 4px 8px 3px rgba(0,0,0,.15);
  --ease-emph:cubic-bezier(.2,0,0,1);
  --ease-emph-dec:cubic-bezier(.05,.7,.1,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --hover:color-mix(in srgb,var(--md-on-surface) 8%,transparent);
  --press:color-mix(in srgb,var(--md-on-surface) 12%,transparent);
  --panel-radius:36px;
  --sidebar-w:272px;
  --aside-w:340px;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Poppins",sans-serif;
  background:var(--brand);color:var(--md-on-surface);
  -webkit-font-smoothing:antialiased;
  font-size:14px;line-height:20px;letter-spacing:.25px;
}
*{font-family:inherit}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
:focus-visible{outline:2px solid var(--md-primary);outline-offset:2px;border-radius:var(--r-sm)}
[data-r]{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;background:currentColor;pointer-events:none;transform:scale(0);opacity:.18;animation:rip .6s var(--ease-emph) forwards}
@keyframes rip{60%{opacity:.12}to{transform:scale(1);opacity:0}}
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;height:100dvh}
.sidebar{position:relative;color:#fff;display:flex;flex-direction:column;padding:34px 0 30px;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.sidebar::-webkit-scrollbar{display:none}
.sidebar :focus-visible{outline-color:#fff}
.brand{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:0 18px 0 30px;margin-bottom:56px}
.brand .gc{width:40px;height:auto;display:block;flex:none}
.brand .college{width:72px;height:auto;display:block;flex:none;margin-left:auto}
.brand span{font-weight:600;font-size:22px;line-height:24px;letter-spacing:0}
.brand small{display:block;font-size:17px;font-weight:500;line-height:22px}
.nav{position:relative;z-index:1;display:flex;flex-direction:column;gap:9px;list-style:none;padding:0}
.nav a{display:flex;align-items:center;gap:14px;height:52px;padding-left:44px;margin-right:12px;border-radius:0 var(--r-xl) var(--r-xl) 0;
  font-size:17px;line-height:24px;letter-spacing:.1px;color:#FFFFFFB2;font-weight:400;transition:background-color .2s,color .2s}
.nav a .i{font-size:24px;stroke-width:1.9}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a:active{background:rgba(255,255,255,.12)}
.nav a.active{font-weight:600;color:#fff}
.nav a.active:hover{background:transparent}
.sidebar .settings{margin-top:auto}
.nav-tab{position:absolute;left:0;top:0;width:14px;z-index:2;pointer-events:none;will-change:transform}
.nav-tab i{display:block;width:100%;height:100%;background:#fff;border-radius:0 10px 10px 0;transform-origin:left center}
.scrim{display:none}
.panel{
  margin:12px 12px 12px 0;border-radius:var(--panel-radius);background:var(--md-surface);overflow:hidden;position:relative;
  display:grid;grid-template-columns:minmax(0,1fr) var(--aside-w);grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"head profile" "main side";min-height:0;transition:background-color .3s;
}
.panel::before{content:"";grid-column:2;grid-row:1/-1;background:var(--md-surface-container-low);z-index:0}
.head,.profile,.main,.side{position:relative;z-index:1}
.head{grid-area:head;display:flex;align-items:center;gap:6px;padding:34px 34px 0 38px}
.panel>.head{z-index:20}
.title{display:flex;align-items:center;margin-right:auto;min-width:0}
.head h1{font-size:clamp(26px,2.6vw,38px);line-height:1.2;font-weight:600;color:var(--headline);letter-spacing:-.2px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.icon-btn,.menu-btn{position:relative;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:26px;color:var(--md-on-surface-variant);transition:background-color .2s,color .2s}
.icon-btn:hover,.menu-btn:hover{background:var(--hover)}
.icon-btn:active,.menu-btn:active{background:var(--press)}
.menu-btn{display:none;color:var(--md-on-surface);font-size:24px}
.rel{position:relative}
.badge{position:absolute;top:9px;right:10px;width:12px;height:12px;border-radius:50%;background:var(--md-error);border:2px solid var(--md-surface)}
.badge[hidden]{display:none}
.search{display:flex;align-items:center;overflow:hidden;width:0;opacity:0;transition:width .35s var(--ease-emph),opacity .2s}
.search.open{width:min(280px,40vw);opacity:1}
.search input{width:100%;height:48px;border:0;border-radius:var(--r-xl);background:var(--md-surface-container-high);color:var(--md-on-surface);padding:0 20px;font:inherit;font-size:14px;letter-spacing:.25px;outline:none;transition:box-shadow .2s,background-color .2s}
.search input::placeholder{color:var(--md-on-surface-variant)}
.search input:focus{box-shadow:inset 0 0 0 2px var(--md-primary)}
.pop{position:absolute;right:0;top:calc(100% + 6px);width:min(320px,86vw);background:var(--md-surface-container-high);color:var(--md-on-surface);border-radius:var(--r-lg);
  box-shadow:var(--e2);padding:8px 0;z-index:30;display:none;text-align:left;transform-origin:top right}
.pop.open{display:block;animation:pop .22s var(--ease-emph-dec)}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(-6px)}}
.pop h3{font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px;padding:8px 16px 10px;color:var(--md-on-surface-variant)}
.pop ul{padding:0}
.pop li{list-style:none;padding:10px 16px;font-size:14px;line-height:20px;transition:background-color .2s;cursor:pointer}
.pop li:hover{background:var(--hover)}
.pop li small{display:block;color:var(--md-on-surface-variant);font-size:12px;line-height:16px;letter-spacing:.4px;margin-top:2px}
.profile{grid-area:profile;display:flex;align-items:center;justify-content:flex-end;gap:14px;padding:32px 30px 0 20px;text-align:right}
.profile b{display:block;font-weight:500;font-size:18px;line-height:24px;letter-spacing:0;white-space:nowrap}
.profile small{display:block;font-size:13px;line-height:18px;color:#99A1AF}
.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;display:block}
.main{grid-area:main;padding:26px 34px 34px 38px;overflow-y:auto;min-height:0;display:flex;flex-direction:column}
.filters{display:flex;align-items:center;flex-wrap:wrap;gap:10px 12px;margin-bottom:26px}
.filters>span{font-size:14px;font-weight:400;letter-spacing:.1px;color:#364153;margin-right:4px}
.dd{position:relative}
.dd>button{display:flex;align-items:center;gap:8px;height:40px;padding:0 10px 0 18px;border-radius:12px;background:var(--field);border:0;font-size:14px;font-weight:400;letter-spacing:.1px;color:#364153;transition:background-color .2s,color .2s}
.dd>button:hover{background:color-mix(in srgb,var(--md-on-surface) 8%,var(--field))}
.dd>button .chk{display:none;font-size:18px;margin-left:-6px}
.dd>button .i.chev{font-size:20px;transition:transform .3s var(--ease-emph)}
.dd.open>button .chev{transform:rotate(180deg)}
.dd.active>button{background:var(--md-secondary-container);border-color:transparent;color:var(--md-on-secondary-container);padding-left:12px}
.dd.active>button .chk{display:block}
.dd .pop{left:0;right:auto;width:200px;transform-origin:top left}
.dd.open .pop{display:block;animation:pop .22s var(--ease-emph-dec)}
.dd .pop button{display:flex;align-items:center;justify-content:space-between;width:100%;height:48px;text-align:left;padding:0 16px;font-size:14px;letter-spacing:.25px;color:var(--md-on-surface);transition:background-color .2s}
.dd .pop button:hover{background:var(--hover)}
.dd .pop button .i{font-size:20px;color:var(--md-primary);opacity:0}
.dd .pop button[aria-checked="true"]{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.dd .pop button[aria-checked="true"] .i{opacity:1;color:inherit}
.text-btn{height:40px;padding:0 12px;border-radius:var(--r-xl);font-size:14px;font-weight:500;letter-spacing:.1px;color:var(--md-primary);transition:background-color .2s}
.text-btn:hover{background:color-mix(in srgb,var(--md-primary) 8%,transparent)}
.text-btn:active{background:color-mix(in srgb,var(--md-primary) 12%,transparent)}
.text-btn[hidden]{display:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:clamp(200px,24dvh,270px);align-content:start;gap:22px}
.card{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:200px;border-radius:24px;overflow:hidden;color:var(--card-ink);
  padding:26px 26px 24px;isolation:isolate;box-shadow:0 0 0 rgba(0,0,0,0);container-type:inline-size;
  transition:transform .35s var(--ease-emph),box-shadow .3s,filter .3s;animation:in .45s var(--ease-emph-dec) both}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.card:hover{transform:translateY(-4px);box-shadow:var(--e3)}
.card:active{transform:translateY(-1px);box-shadow:var(--e1)}
.card[hidden]{display:none}
.card .art{position:absolute;right:0;top:50%;width:490.131px;height:263.357px;margin-top:-131.68px;transform:scale(.85);transform-origin:right center;pointer-events:none;z-index:-2}
.card .ct,.card .by{position:relative;z-index:1}
.go{z-index:2}
.card .art svg{width:490.131px;height:263.357px;display:block;overflow:visible}
.card .art svg path{transform-box:fill-box;transform-origin:center;transition:transform 1.2s cubic-bezier(.22,.8,.24,1)}
.card:hover .art svg path:nth-child(1){transform:translate(-6px,4px) rotate(2deg) scale(1.03)}
.card:hover .art svg path:nth-child(2){transform:translate(5px,-3px) rotate(-2.5deg) scale(1.035)}
.card:hover .art svg path:nth-child(3){transform:translate(-4px,-5px) rotate(2deg) scale(1.025)}
.card:hover .art svg path:nth-child(n+4):nth-child(4n){transform:translate(7px,-8px) rotate(14deg) scale(1.08)}
.card:hover .art svg path:nth-child(n+4):nth-child(4n+1){transform:translate(-8px,6px) rotate(-12deg) scale(1.06)}
.card:hover .art svg path:nth-child(n+4):nth-child(4n+2){transform:translate(6px,7px) rotate(10deg) scale(.94)}
.card:hover .art svg path:nth-child(n+4):nth-child(4n+3){transform:translate(-6px,-7px) rotate(-16deg) scale(1.1)}
.card h2{font-size:clamp(22px,6.12cqw,30px);font-weight:500;letter-spacing:0;line-height:1.25}
.card p.batch{margin-top:12px;font-size:clamp(15px,4.3cqw,21px);line-height:1.3;color:var(--card-ink-variant);letter-spacing:.2px}
.card .by{font-size:14px;color:var(--card-ink-quiet)}
.card .by b{font-weight:500;color:var(--card-ink)}
.go{position:absolute;right:26px;bottom:26px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  color:#fff;font-size:24px;box-shadow:none;transition:transform .35s var(--ease-spring)}
.card:hover .go{transform:translateX(4px) scale(1.06)}
.go.purple{background:var(--purple)}
.go.coral{background:var(--coral)}
.empty{grid-column:1/-1;text-align:center;padding:60px 10px;color:var(--md-on-surface-variant);font-size:16px;line-height:24px}
.side{grid-area:side;padding:62px 30px 30px;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:44px}
.sec-title{font-size:22px;line-height:28px;font-weight:600;letter-spacing:0;color:var(--headline)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-nav{display:flex;gap:2px}
.cal-nav button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:24px;color:var(--md-on-surface-variant);transition:background-color .2s}
.cal-nav button:hover{background:var(--hover)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;text-align:center}
.cal .dow{font-size:12px;line-height:16px;letter-spacing:.5px;color:var(--md-on-surface-variant);padding:6px 0 10px}
.day{position:relative;height:40px;font-size:14px;line-height:20px;letter-spacing:.25px;color:var(--md-on-surface);display:grid;place-items:center;isolation:isolate;transition:color .2s}
.day.empty-cell{pointer-events:none}
.day:not(.empty-cell)::after{content:"";position:absolute;top:50%;left:50%;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;z-index:-1;transition:background-color .2s}
.day:not(.empty-cell):hover::after{background:var(--hover)}
.day.today:not(.start):not(.end)::after{box-shadow:inset 0 0 0 1px var(--md-primary)}
.day.today{color:var(--md-primary);font-weight:600}
.day.in-range::before{content:"";position:absolute;left:0;right:0;top:3px;bottom:3px;background:var(--md-primary-container);z-index:-2}
.day.start::before{left:50%}
.day.end::before{right:50%}
.day.start.end::before{display:none}
.day.start::after,.day.end::after,.day.start:hover::after,.day.end:hover::after{background:var(--md-primary);animation:sel .4s var(--ease-spring)}
@keyframes sel{from{transform:scale(.5);opacity:.4}}
.day.start,.day.end{color:var(--md-on-primary);font-weight:500}
.users-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.users-head .text-btn{margin-right:-12px;font-weight:400}
.users{list-style:none;padding:0;display:flex;flex-direction:column;gap:2px}
.user{display:flex;align-items:center;gap:16px;padding:8px 12px;margin:0 -12px;border-radius:var(--r-lg);transition:background-color .2s;animation:in .4s var(--ease-emph-dec) both;cursor:pointer}
.user:hover{background:var(--hover)}
.user .avatar{width:44px;height:44px}
.ini{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:500;font-size:15px;flex:none}
.user div{min-width:0;margin-right:auto}
.user b{display:block;font-weight:400;font-size:16px;line-height:24px;letter-spacing:.15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user small{display:block;font-size:13px;line-height:18px;color:#99A1AF}
.dot{width:9px;height:9px;border-radius:50%;background:var(--md-primary);margin-right:4px;position:relative;flex:none}
@media (max-width:1280px){
  :root{--aside-w:310px;--sidebar-w:246px}
  .brand{padding-left:22px;padding-right:14px;gap:10px}
  .brand .college{width:62px}
  .nav a{padding-left:34px}
  .go{width:40px;height:40px}
}
@media (max-width:1100px){
  html,body{height:auto}
  .app{height:auto;min-height:100dvh}
  .panel{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto;grid-template-areas:"head profile" "main main" "side side";margin-bottom:12px;overflow:clip}
  .panel::before{display:none}
  .main{overflow:visible;padding-bottom:10px;display:block}
  .side{overflow:visible;background:var(--md-surface-container-low);padding:30px 34px 36px;display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:start}
  .head{padding-right:10px}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;inset:0 auto 0 0;width:min(290px,84vw);z-index:60;background:var(--brand);transform:translateX(-102%);transition:transform .4s var(--ease-emph);box-shadow:none;border-radius:0 var(--r-xl) var(--r-xl) 0}
  body.nav-open .sidebar{transform:none;box-shadow:var(--e3)}
  .scrim{display:block;position:fixed;inset:0;background:var(--md-scrim);opacity:0;pointer-events:none;transition:opacity .3s;z-index:50}
  body.nav-open .scrim{opacity:1;pointer-events:auto}
  .menu-btn{display:grid}
  .panel{margin:0;border-radius:0;min-height:100dvh}
  .head{padding-left:10px;padding-top:22px}
  .profile{padding-top:22px;padding-right:18px}
  .main{padding:22px 18px 6px}
  .side{padding:26px 18px 34px}
}
@media (max-width:640px){
  .side{grid-template-columns:1fr;gap:34px}
  .profile div{display:none}
  .head h1{font-size:20px;flex:none}
    .icon-btn,.menu-btn{width:36px;height:36px;font-size:22px}
  .badge{top:6px;right:7px}
  .search.open{width:min(170px,36vw)}
  .head{gap:0}
  .profile{padding-left:6px;padding-right:12px}
  .dd>button{padding-left:12px}
  .filters>span{display:none}
  .filters{gap:8px;margin-bottom:18px}
  .dd>button{height:36px;padding:0 3px 0 10px;gap:0;font-size:13px;letter-spacing:0}
  .dd>button .i.chev{font-size:18px}
  .dd.active>button{padding-left:8px}
  .filters .text-btn{height:36px;padding:0 8px}
  .grid{grid-template-columns:1fr;grid-auto-rows:auto;gap:14px}
  .card{min-height:170px;padding:20px 20px 18px;border-radius:24px}
  .card p.batch{margin-top:8px}
  .card .by{max-width:calc(100% - 60px)}
  .go{width:44px;height:44px;right:18px;bottom:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">

const $ = (s,r=document)=>r.querySelector(s);
const el = (tag,cls,html)=>{const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e;};
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
document.addEventListener('pointerdown',e=>{
  const t = e.target.closest('[data-r]'); if(!t || t.disabled || reduced.matches) return;
  const r = t.getBoundingClientRect(), s = Math.max(r.width,r.height)*2.2;
  const w = el('span','rip');
  w.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;
  t.appendChild(w); w.addEventListener('animationend',()=>w.remove());
});
const sidebar = $('#sidebar'), navTab = $('#navTab');
const navLinks = [...document.querySelectorAll('.nav a')];
const setNav = open => {
  document.body.classList.toggle('nav-open', open);

};
$('#menuBtn').onclick = ()=>setNav(!document.body.classList.contains('nav-open'));

let navTop = null;
const currentY = node => { try{ return new DOMMatrix(getComputedStyle(node).transform).m42; }catch(e){ return 0; } };
function placeIndicator(a, animate){
  const sr = sidebar.getBoundingClientRect(), ar = a.getBoundingClientRect();
  const top = ar.top - sr.top + sidebar.scrollTop, h = ar.height;
  navTab.style.height = h+'px';
  const move = (node, o)=>{
    const from = navTop==null ? top : currentY(node);
    node.getAnimations().forEach(x=>x.cancel());
    node.style.transform = `translateY(${top}px)`;
    const d = top-from;
    if(!animate || navTop==null || Math.abs(d)<1 || reduced.matches) return;
    const dir = Math.sign(d), over = clamp(Math.abs(d)*.06,4,10)*o.bounce;
    node.animate([
      {transform:`translateY(${from}px)`, easing:'cubic-bezier(.2,.9,.25,1)'},
      {transform:`translateY(${top+dir*over}px)`, offset:.6, easing:'cubic-bezier(.4,0,.3,1)'},
      {transform:`translateY(${top}px)`}
    ],{duration:o.dur, delay:o.delay, fill:'backwards'});
  };
  move(navTab,{dur:520, delay:0,  bounce:1});
  if(animate && navTop!=null && !reduced.matches){
    const k = 1 + clamp(Math.abs(top-navTop)/h*.09,.12,.6);
    navTab.firstElementChild.getAnimations().forEach(x=>x.cancel());
    navTab.firstElementChild.animate(
      [{transform:'scale(1,1)'},{transform:`scale(1.15,${k})`,offset:.38},{transform:'scale(.94,.96)',offset:.7},{transform:'scale(1,1)'}],
      {duration:560,easing:'ease-out'});
  }
  navTop = top;
}
const activeLink = ()=>navLinks.find(x=>x.classList.contains('active'));
const settle = ()=>{ navTop=null; placeIndicator(activeLink(),false); };

const state = {time:'',level:'',language:'',type:'',q:''};
const filtersEl = $('#filters');
const labels = {time:'Time',level:'Level',language:'Language',type:'Type'};
const dds = {};
const closeMenus = except=>{
  document.querySelectorAll('.dd.open').forEach(d=>{ if(d!==except){d.classList.remove('open'); d.firstElementChild.setAttribute('aria-expanded','false');}});
  if(except!==$('#bellPop').parentNode) {$('#bellPop').classList.remove('open'); $('#bellBtn').setAttribute('aria-expanded','false');}
};
Object.keys(FILTERS).forEach(key=>{
  const dd = el('div','dd');
  const btn = el('button',null,`<span>${labels[key]}</span>`); btn.type='button'; btn.dataset.r='';
  btn.setAttribute('aria-haspopup','listbox'); btn.setAttribute('aria-expanded','false');
  btn.prepend($('#check').content.cloneNode(true));
  btn.appendChild($('#chev').content.cloneNode(true));
  const pop = el('div','pop'); pop.setAttribute('role','listbox');
  ['All',...FILTERS[key]].forEach(v=>{
    const o = el('button',null,`<span>${v}</span>`); o.type='button'; o.dataset.r=''; o.setAttribute('role','option');
    o.appendChild($('#check').content.cloneNode(true));
    o.setAttribute('aria-checked', v==='All');
    o.onclick = ()=>{
      state[key] = v==='All' ? '' : v;
      pop.querySelectorAll('button').forEach(b=>b.setAttribute('aria-checked', b===o));
      btn.querySelector('span').textContent = state[key] || labels[key];
      dd.classList.toggle('active', !!state[key]);
      dd.classList.remove('open'); btn.setAttribute('aria-expanded','false');
      apply();
    };
    pop.appendChild(o);
  });
  btn.onclick = e=>{
    e.stopPropagation();
    const open = !dd.classList.contains('open');
    closeMenus(dd); dd.classList.toggle('open',open); btn.setAttribute('aria-expanded',open);
  };
  pop.onclick = e=>e.stopPropagation();
  dd.append(btn,pop); filtersEl.appendChild(dd); dds[key]={dd,btn,pop};
});
const clear = el('button','text-btn','Clear all'); clear.type='button'; clear.dataset.r=''; clear.hidden=true; filtersEl.appendChild(clear);
function apply(){
  const q = state.q.trim().toLowerCase();
  let shown = 0;
  grid.querySelectorAll('.card').forEach(card=>{
    const c = COURSES.find(x=>x.id===card.dataset.id);
    const ok = Object.keys(FILTERS).every(k=>!state[k]||c[k]===state[k]) &&
               (!q || (c.title+' '+c.by+' '+c.batch).toLowerCase().includes(q));
    card.hidden = !ok; if(ok){shown++; card.style.animation='none'; card.offsetWidth; card.style.animation='';}
  });
  empty.hidden = shown>0;
  clear.hidden = !(Object.keys(FILTERS).some(k=>state[k]) || q);
}
function reset(){
  Object.keys(FILTERS).forEach(k=>{state[k]=''; dds[k].btn.querySelector('span').textContent=labels[k]; dds[k].dd.classList.remove('active');
    dds[k].pop.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-checked',i===0));});
  state.q=''; $('#q').value=''; apply();
}
clear.onclick = reset; $('#resetEmpty').onclick = reset;

document.addEventListener('keydown',e=>{ if(e.key==='Escape'){closeMenus(); setNav(false);} });
const today = new Date(); today.setHours(0,0,0,0);
const key = d=>d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
let view = new Date(today.getFullYear(), today.getMonth(), 1);
let start = new Date(today.getFullYear(), today.getMonth(), 16), end = new Date(today.getFullYear(), today.getMonth(), 18);
let picking = false;
const cal = $('#cal');
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function renderCal(){
  $('#calTitle').textContent = view.toLocaleString('en-US',{month:'short',year:'numeric'});
  cal.innerHTML = '';
  DOW.forEach(d=>cal.appendChild(el('div','dow',d)));
  const first = (view.getDay()+6)%7;
  const days = new Date(view.getFullYear(), view.getMonth()+1, 0).getDate();
  for(let i=0;i<first;i++) cal.appendChild(el('div','day empty-cell'));
  const ks = start&&key(start), ke = end&&key(end);
  for(let n=1;n<=days;n++){
    const d = new Date(view.getFullYear(), view.getMonth(), n), k = key(d);
    const b = el('button','day',String(n)); b.type='button';
    if(k===key(today)) b.classList.add('today');
    if(ks && ke && k>=ks && k<=ke){
      b.classList.add('in-range');
      if(k===ks) b.classList.add('start');
      if(k===ke) b.classList.add('end');
    }
    b.setAttribute('aria-label', d.toDateString());
    b.onclick = ()=>{
      if(!start || (start && end && key(start)!==key(end)) || (start && end && k===key(start))){ start=d; end=d; picking=true; }
      else if(picking){ if(k<key(start)){end=start; start=d;} else end=d; picking=false; }
      else { start=d; end=d; picking=true; }
      renderCal();
    };
    cal.appendChild(b);
  }
}
$('#prev').onclick = ()=>{view.setMonth(view.getMonth()-1); renderCal();};
$('#next').onclick = ()=>{view.setMonth(view.getMonth()+1); renderCal();};
renderCal();
const usersEl = $('#users'); let showAll = false;
function renderUsers(){
  usersEl.innerHTML='';
  USERS.slice(0, showAll?USERS.length:4).forEach((u,i)=>{
    const li = el('li','user'); li.dataset.r=''; li.style.animationDelay=(i*50)+'ms';
    const av = u.img ? Object.assign(el('img','avatar'),{src:u.img,alt:u.name})
                     : el('div','ini',u.name.split(' ').map(w=>w[0]).join(''));
    if(!u.img) av.style.background=u.color;
    li.append(av, el('div',null,`<b>${u.name}</b><small>${u.id}</small>`), el('span','dot'));
    usersEl.appendChild(li);
  });
  $('#seeAll').textContent = showAll ? 'Show less' : 'See all';
}
$('#seeAll').onclick = ()=>{showAll=!showAll; renderUsers();};
renderUsers();
navLinks.forEach(a=>a.addEventListener('click',e=>{
  e.preventDefault();
  navLinks.forEach(x=>{x.classList.remove('active');x.removeAttribute('aria-current')});
  a.classList.add('active'); a.setAttribute('aria-current','page');
  placeIndicator(a,true);
  if(document.body.classList.contains('nav-open')) setTimeout(()=>setNav(false),380);
}));
</script>
</body>
</html>
